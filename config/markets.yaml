    valuation: 0.15
    seasonality: 0.10
    retail: 0.05
    technical: 0.05

  fx:
    retail: 0.25
    commercials: 0.15
    cot_net: 0.15
    fund_manager: 0.15
    valuation: 0.15
    seasonality: 0.10
    trend: 0.05

  equities:
    valuation_13w: 0.30
    valuation_30d: 0.20
    election_cycle: 0.20
    decennial: 0.15
    trend: 0.05
    technical: 0.10

# Thresholds
thresholds:
  valuation_undervalued: -75
  valuation_overvalued: 75
  valuation_near: 15  # range around threshold to mention
  seasonality_lookback_years: 10
